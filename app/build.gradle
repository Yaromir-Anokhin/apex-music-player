plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apex.meshplayer'
    compileSdk 35

    defaultConfig {
        applicationId "com.apex.meshplayer"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    // Two device builds from one codebase:
    //   huawei -> Huawei P20 Pro, Android 10 / EMUI 10   (ApexMusic-Player-HuaweiP20Pro.apk)
    //   redmi  -> Redmi / Xiaomi, Android 15 / HyperOS   (ApexMusic-Player-RedmiAndroid15.apk)
    flavorDimensions = ["device"]
    productFlavors {
        huawei {
            dimension "device"
            targetSdk 34
            versionNameSuffix "-huaweiP20Pro"
        }
        redmi {
            dimension "device"
            targetSdk 35
            versionNameSuffix "-redmiA15"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def device = variant.flavorName == "redmi" ? "RedmiAndroid15" : "HuaweiP20Pro"
            outputFileName = "ApexMusic-Player-${device}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

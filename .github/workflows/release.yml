name: Release - Publish APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build web application (Vite)
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Huawei & Redmi Release APKs
        run: ./gradlew assembleHuaweiRelease assembleRedmiRelease

      - name: Collect Release APKs
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/huawei/release/*.apk release-artifacts/
          cp app/build/outputs/apk/redmi/release/*.apk release-artifacts/
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

Summary: Modern music player with YouTube audio & cover art downloader, custom playlists, and background playback for all Android devices
Description: |-
  Apex Music Player is a modern, lightweight, privacy-focused open-source audio player for Android.
  It is engineered for universal compatibility across all Android versions (Android 5.0 Lollipop to Android 15+) and manufacturers (Samsung, Google Pixel, Xiaomi, Redmi, Huawei, OnePlus, Motorola, Sony, etc.).

  Key Features:
  * Universal Android Compatibility: Runs on Android 5.0 to Android 15+ (API 21 to 35), with native Edge-to-Edge display on Android 15 and OLED True Black on older versions.
  * Direct YouTube Search & Download: Search videos and download high-bitrate audio with album art directly to local storage via open-source NewPipeExtractor.
  * Custom Playlists System: Create personal playlists with custom emoji badges, reorder, sort, and organize tracks effortlessly.
  * Background Playback: Foreground Service with notification shade controls, lock screen artwork, and full headset button support.
  * Persistent State: Never lose your playback queue, track position, or favorite list after task dismissal or low-memory kill.
  * 10-Band Equalizer & Visualizer: Hardware-accelerated audio effects, bass boost, and animated 3D audio reactive spectrum.
  * Convenience Controls: Playback speed (0.5x - 2.0x), ±10s seek jump buttons, instant search filter, and track sorting.
  * 100% Free & Open Source: No ads, no telemetry, no tracking, no proprietary Google Play Services required.

